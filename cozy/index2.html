<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cozy Blog Social</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #020617;
  --bg-soft: #0f172a;
  --panel: #030712;
  --card-border: rgba(255,255,255,0.06);
  --text: #f8fafc;
  --muted: #94a3b8;
  --accent: #2563eb;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  background: linear-gradient(180deg, #020617 0%, #0f172a 100%);
  color: var(--text);
  font-family: Inter, sans-serif;
  overflow: hidden;
}

img { max-width: 100%; display: block; }
button { font: inherit; }

.header {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 16px;
  background: rgba(2, 6, 23, 0.85);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid rgba(255,255,255,0.04);
}

.brand {
  font-weight: 700;
  font-size: 18px;
  letter-spacing: -0.02em;
}

.feed {
  height: calc(100vh - 57px);
  overflow-y: auto;
  padding: 0 0 28px;
  display: grid;
  gap: 0;
}

.card {
  position: relative;
  display: flex;
  flex-direction: column;
  background: transparent;
  border: 0;
  border-bottom: 1px solid rgba(255,255,255,0.08);
  border-radius: 0;
  overflow: hidden;
  cursor: pointer;
  box-shadow: none;
  padding: 22px 16px;
  gap: 14px;
}

.card-link {
  position: absolute;
  inset: 0;
  z-index: 5;
  text-indent: -9999px;
}

.card-content,
.card-image,
.actions {
  position: relative;
  z-index: 1;
  pointer-events: none;
}

.card-image {
  display: block;
  width: 100%;
  height: 220px;
  object-fit: cover;
  background: #0b1220;
  border-radius: 16px;
  margin-top: 4px;
  align-self: stretch;
  opacity: 0;
  transform: scale(1.02);
  transition: opacity 0.45s ease, transform 0.7s ease;
}

.card-image.is-loaded {
  opacity: 1;
  transform: scale(1);
}

.card-content {
  display: flex;
  flex-direction: column;
  width: 100%;
  padding: 0;
  background: transparent;
}

.meta {
  display: block;
  color: #9fb0c6;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  margin-bottom: 10px;
}

.card-title {
  display: block;
  color: #ffffff;
  font-family: AGaramondPro, "Adobe Garamond Pro", garamond, Times, serif;
  font-size: clamp(34px, 8vw, 54px);
  line-height: 0.98;
  letter-spacing: -0.035em;
  margin-bottom: 12px;
  text-wrap: balance;
}

.card-excerpt {
  display: -webkit-box;
  -webkit-line-clamp: 4;
  -webkit-box-orient: vertical;
  overflow: hidden;
  color: #d4dcea;
  font-family: AGaramondPro, "Adobe Garamond Pro", garamond, Times, serif;
  font-size: clamp(17px, 4.6vw, 21px);
  line-height: 1.42;
  max-width: 62ch;
  margin-bottom: 12px;
}

.actions {
  display: none;
}

.read-btn {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  border: 1px solid rgba(37,99,235,0.45);
  color: var(--text);
  background: rgba(37,99,235,0.08);
  padding: 11px 18px;
  border-radius: 999px;
  font-family: AGaramondPro, "Adobe Garamond Pro", garamond, Times, serif;
  font-size: 18px;
}

.icon-btn {
  width: 36px;
  height: 36px;
  border-radius: 999px;
  display: grid;
  place-items: center;
  color: #dbe4f0;
  background: transparent;
  border: 1px solid rgba(255,255,255,0.08);
}

.progress {
  position: fixed;
  top: 0;
  left: 0;
  z-index: 2000;
  height: 3px;
  width: 0%;
  background: linear-gradient(90deg, #60a5fa, #2563eb);
}

.reader {
  position: fixed;
  inset: 0;
  z-index: 1000;
  background: #020617;
  transform: translateY(100%);
  transition: transform 0.34s ease;
  display: flex;
  flex-direction: column;
}

.reader.active {
  transform: translateY(0);
}

.reader-topbar {
  position: sticky;
  top: 0;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px;
  background: rgba(2, 6, 23, 0.92);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid rgba(255,255,255,0.04);
}

.back-btn, .save-btn {
  border: none;
  background: transparent;
  color: var(--accent);
  cursor: pointer;
  padding: 8px;
}

.reader-slider {
  flex: 1;
  display: flex;
  flex-direction: column;
  transition: transform 0.38s ease;
  will-change: transform;
}

.slide {
  min-height: 100%;
  overflow-y: auto;
  padding: 18px 18px 34px;
}

.slide-hero-wrap {
  position: relative;
  overflow: hidden;
  border-radius: 18px;
  margin-bottom: 18px;
}

.slide-hero-wrap::after {
  content: "";
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(2,6,23,0.05) 0%, rgba(2,6,23,0.18) 40%, rgba(2,6,23,0.72) 100%);
  pointer-events: none;
}

.slide-hero {
  width: 100%;
  height: 230px;
  object-fit: cover;
  display: block;
  opacity: 0;
  transform: scale(1.02);
  transition: opacity 0.45s ease, transform 0.7s ease;
}

.slide-hero.is-loaded {
  opacity: 1;
  transform: scale(1);
}

.slide-meta {
  color: #b7c2d0;
  font-size: 12px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  margin-bottom: 8px;
}

.slide-title {
  font-family: AGaramondPro, "Adobe Garamond Pro", garamond, Times, serif;
  font-size: clamp(32px, 8vw, 42px);
  line-height: 1.12;
  margin-bottom: 20px;
}

.article-body {
  font-family: AGaramondPro, "Adobe Garamond Pro", garamond, Times, serif;
  font-size: clamp(20px, 4.8vw, 23px);
  line-height: 1.7;
  color: #eef2f7;
}

.article-body p {
  margin-bottom: 18px;
}

.article-body p:first-child::first-letter {
  float: left;
  font-size: 4em;
  line-height: 0.76;
  margin-right: 0.12em;
}

.pull-quote {
  text-align: center;
  font-family: AGaramondPro, "Adobe Garamond Pro", garamond, Times, serif;
  font-size: clamp(28px, 7vw, 38px);
  line-height: 1.2;
  color: #cbd5e1;
  margin: 34px 0;
}

.pull-quote::before,
.pull-quote::after {
  content: "";
  display: block;
  width: 110px;
  height: 1px;
  background: rgba(255,255,255,0.18);
  margin: 18px auto;
}

.inline-img {
  margin: 28px 0;
}

.inline-img img {
  width: 100%;
  border-radius: 16px;
}

.caption {
  color: var(--muted);
  font-size: 12px;
  text-align: center;
  margin-top: 8px;
  letter-spacing: 0.04em;
}

mark {
  background: rgba(96,165,250,0.28);
  color: #fff;
  padding: 2px 4px;
  border-radius: 4px;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 18px;
  transform: translateX(-50%) translateY(20px);
  opacity: 0;
  pointer-events: none;
  z-index: 2500;
  background: rgba(15, 23, 42, 0.96);
  color: #fff;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 999px;
  padding: 10px 16px;
  font-size: 14px;
  transition: all 0.24s ease;
}

.toast.show {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

@media (min-width: 768px) {
  .feed {
    max-width: 920px;
    margin: 0 auto;
    padding: 10px 0 48px;
  }

  .card {
    padding: 28px 0;
    gap: 16px;
  }

  .card-title {
    font-size: clamp(40px, 5vw, 58px);
  }

  .card-excerpt {
    font-size: 20px;
    max-width: 58ch;
  }

  .card-image {
    width: 100%;
    height: 320px;
  }

  .slide {
    max-width: 760px;
    margin: 0 auto;
  }
}

@media (max-width: 767px) {
  .card {
    gap: 14px;
  }

  .card-title {
    font-size: clamp(32px, 10vw, 42px);
  }

  .card-image {
    height: 210px;
  }
}
</style>
</head>
<body>
<div class="progress" id="progress"></div>

<header class="header">
  <div class="brand">✨ CozyBlog</div>
  <div style="color: var(--muted); font-size: 14px;">Text-first social</div>
</header>

<section class="feed" id="blogContainer"></section>

<div class="reader" id="reader" aria-hidden="true">
  <div class="reader-topbar">
    <button class="back-btn" id="backBtn">← Back</button>
    <button class="save-btn" id="saveBtn">💾 Save highlight</button>
  </div>
  <div class="reader-slider" id="slider"></div>
</div>

<div class="toast" id="toast"></div>

<script>
const posts = [
  {
    title: "The Abu Dhabi campus of New York University has closed",
    date: "March 31, 2026",
    category: "Article",
    excerpt: "President Trump on Monday renewed his threat to begin completely obliterating Iranian...",
    img: "https://picsum.photos/900/600?random=11",
    content: [
      "The campus closure has sparked strong reactions across student communities in the region.",
      "Education spaces shape the future long before policy catches up.",
      "Students and faculty are now searching for continuity, support, and clear direction after the announcement.",
      "IMAGE",
      "The wider story is not only about one institution, but about the global meaning of access and belonging."
    ]
  },
  {
    title: "Design Trends That Are Defining 2026",
    date: "March 30, 2026",
    category: "Feature",
    excerpt: "Explore modern UI trends shaping the future of apps, social products, and immersive reading.",
    img: "https://picsum.photos/900/600?random=12",
    content: [
      "Design in 2026 is becoming calmer, more tactile, and more emotionally aware.",
      "Interfaces feel best when they disappear and let the story lead.",
      "Typography, motion, and spacing are now central to how products earn trust and attention.",
      "IMAGE",
      "The strongest experiences are subtle, fast, and deeply human."
    ]
  },
  {
    title: "Why Text-First Social Apps Are Rising",
    date: "March 29, 2026",
    category: "Analysis",
    excerpt: "Readers are spending more time in focused communities built around ideas instead of short videos.",
    img: "https://picsum.photos/900/600?random=13",
    content: [
      "A new wave of apps is bringing back the pleasure of reading in social spaces.",
      "People still crave intimacy, reflection, and language.",
      "Instead of endless noise, users are looking for thoughtful posts, saved highlights, and meaningful discussion.",
      "IMAGE",
      "The next generation of social products may be quieter, but much deeper."
    ]
  }
];

const container = document.getElementById('blogContainer');
const reader = document.getElementById('reader');
const slider = document.getElementById('slider');
const progress = document.getElementById('progress');
const toastEl = document.getElementById('toast');
const backBtn = document.getElementById('backBtn');
const saveBtn = document.getElementById('saveBtn');

let currentIndex = 0;
let startY = 0;
let savedText = '';

function showToast(message) {
  toastEl.textContent = message;
  toastEl.classList.add('show');
  clearTimeout(showToast._timer);
  showToast._timer = setTimeout(() => toastEl.classList.remove('show'), 1800);
}

function formatContent(content, imageUrl) {
  return content.map((block, i) => {
    if (i === 1) {
      return `<div class="pull-quote">“${block}”</div>`;
    }
    if (block === 'IMAGE') {
      return `<div class="inline-img"><img src="${imageUrl}" alt="Article image"><div class="caption">Story image</div></div>`;
    }
    return `<p>${block}</p>`;
  }).join('');
}

function renderPosts() {
  container.innerHTML = '';

  posts.forEach((post, i) => {
    const card = document.createElement('article');
    card.className = 'card';
    card.setAttribute('tabindex', '0');
    card.setAttribute('role', 'link');
    card.setAttribute('aria-label', `Open story: ${post.title}`);
    card.innerHTML = `
      <a href="#" class="card-link" aria-label="Open ${post.title}">Open ${post.title}</a>
      <div class="card-content">
        <div class="meta">${post.category} | ${post.date}</div>
        <h2 class="card-title">${post.title || 'Untitled story'}</h2>
        <p class="card-excerpt">${post.excerpt || 'Tap to open and read this story.'}</p>
        <img class="card-image" loading="lazy" src="${post.img}" alt="${post.title}">
        <div class="actions">
          <div class="read-btn">Read More <span aria-hidden="true">→</span></div>
          <div class="icon-btn" aria-hidden="true">♡</div>
          <div class="icon-btn" aria-hidden="true">🔖</div>
          <div class="icon-btn" aria-hidden="true">↗</div>
        </div>
      </div>
    `;

    const openStory = (event) => {
      event.preventDefault();
      openReader(i);
    };

    card.addEventListener('click', openStory);
    card.addEventListener('keydown', (event) => {
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        openReader(i);
      }
    });

    const image = card.querySelector('.card-image');
    if (image.complete) {
      image.classList.add('is-loaded');
    } else {
      image.addEventListener('load', () => image.classList.add('is-loaded'), { once: true });
    }

    container.appendChild(card);
  });
}

function renderSlides() {
  slider.innerHTML = '';

  posts.forEach((post) => {
    const slide = document.createElement('section');
    slide.className = 'slide';
    slide.innerHTML = `
      <div class="slide-hero-wrap">
        <img class="slide-hero" loading="lazy" src="${post.img}" alt="${post.title}">
      </div>
      <div class="slide-meta">${post.category} | ${post.date}</div>
      <h1 class="slide-title">${post.title}</h1>
      <div class="article-body">${formatContent(post.content, post.img)}</div>
    `;
    slide.addEventListener('scroll', updateProgress);

    const hero = slide.querySelector('.slide-hero');
    if (hero.complete) {
      hero.classList.add('is-loaded');
    } else {
      hero.addEventListener('load', () => hero.classList.add('is-loaded'), { once: true });
    }

    slider.appendChild(slide);
  });
}

function openReader(index) {
  currentIndex = index;
  renderSlides();
  reader.classList.add('active');
  reader.setAttribute('aria-hidden', 'false');
  updateSlide();
  updateProgress();
}

function closeReader() {
  reader.classList.remove('active');
  reader.setAttribute('aria-hidden', 'true');
  progress.style.width = '0%';
}

function updateSlide() {
  slider.style.transform = `translateY(-${currentIndex * 100}%)`;
  requestAnimationFrame(updateProgress);
}

function getCurrentSlide() {
  return slider.children[currentIndex] || null;
}

function updateProgress() {
  const currentSlide = getCurrentSlide();
  if (!currentSlide) return;
  const scrollable = currentSlide.scrollHeight - currentSlide.clientHeight;
  const percent = scrollable > 0 ? (currentSlide.scrollTop / scrollable) * 100 : 0;
  progress.style.width = `${Math.max(0, Math.min(100, percent))}%`;
}

function saveText() {
  if (!savedText) {
    showToast('Highlight text first');
    return;
  }
  showToast(`Saved: ${savedText.slice(0, 60)}${savedText.length > 60 ? '…' : ''}`);
}

backBtn.addEventListener('click', closeReader);
saveBtn.addEventListener('click', saveText);

reader.addEventListener('touchstart', (e) => {
  startY = e.touches[0].clientY;
}, { passive: true });

reader.addEventListener('touchend', (e) => {
  const endY = e.changedTouches[0].clientY;
  const diff = startY - endY;

  if (diff > 50 && currentIndex < posts.length - 1) {
    currentIndex += 1;
    updateSlide();
  } else if (diff < -50 && currentIndex > 0) {
    currentIndex -= 1;
    updateSlide();
  }
}, { passive: true });

reader.addEventListener('mouseup', () => {
  const selection = window.getSelection();
  if (!selection || !selection.toString().trim()) return;

  try {
    const range = selection.getRangeAt(0);
    const mark = document.createElement('mark');
    range.surroundContents(mark);
    savedText = mark.textContent || '';
    selection.removeAllRanges();
    showToast('Highlight saved locally');
  } catch (error) {
    savedText = selection.toString().trim();
    selection.removeAllRanges();
    showToast('Selected text saved');
  }
});

// Simple runtime checks
console.assert(Array.isArray(posts), 'posts should be an array');
console.assert(posts.length > 0, 'posts should not be empty');
console.assert(typeof posts[0].title === 'string', 'post title should be a string');
console.assert(typeof formatContent(posts[0].content, posts[0].img) === 'string', 'formatContent should return HTML string');

renderPosts();
</script>
</body>
</html>
